username: atomi
name: nix
description: AtomiCloud's nix template
project: https://github.com/AtomiCloud/ketone.nix-template
source: https://github.com/AtomiCloud/ketone.nix-template
email: ernest@atomi.cloud
tags: ["atomi","nix"]
readme: README.MD
templates: []
processors:
  - cyan/default
plugins: []
resolvers:
  - resolver: atomi/md
    config: {}
    files: ['CLAUDE.md', 'README.md', '.envrc']
  - resolver: atomi/nix
    config: {}
    files: ['nix/env.nix', 'nix/packages.nix', 'nix/fmt.nix', 'nix/pre-commit.nix', 'nix/shells.nix', 'flake.nix']
  - resolver: atomi/ignore
    config: {}
    files: ['.gitignore']
commands: []
build:
  registry: ${DOMAIN:-docker.io}/${GITHUB_REPO_REF:-atomi}
  platforms:
    - linux/amd64
    - linux/arm64
  images:
    template:
      image: nix
      dockerfile: cyan/Dockerfile
      context: ./cyan
    blob:
      image: 'nix-blob'
      dockerfile: cyan/blob.Dockerfile
      context: .
