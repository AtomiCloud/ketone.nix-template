tests:
  # ============================================
  # No basic, No LLM
  # ============================================
  - name: no_basic_no_llm
    expected:
      type: snapshot
      value:
        path: ./snapshots/no_basic_no_llm
    validate:
      - git init && git add -A && nix develop -c true
    answer_state:
      cyan/nix/basic:
        type: String
        value: 'no'
      cyan/nix/llm:
        type: String
        value: 'no'
    deterministic_state: {}

  # ============================================
  # Yes basic, No LLM
  # ============================================
  - name: yes_basic_no_llm
    expected:
      type: snapshot
      value:
        path: ./snapshots/yes_basic_no_llm
    validate:
      - git init && git add -A && nix develop -c true
    answer_state:
      cyan/nix/basic:
        type: String
        value: 'yes'
      cyan/nix/llm:
        type: String
        value: 'no'
    deterministic_state: {}

  # ============================================
  # No basic, Yes LLM
  # ============================================
  - name: no_basic_yes_llm
    expected:
      type: snapshot
      value:
        path: ./snapshots/no_basic_yes_llm
    validate:
      - git init && git add -A && nix develop -c true
    answer_state:
      cyan/nix/basic:
        type: String
        value: 'no'
      cyan/nix/llm:
        type: String
        value: 'yes'
    deterministic_state: {}

  # ============================================
  # Yes basic, Yes LLM
  # ============================================
  - name: yes_basic_yes_llm
    expected:
      type: snapshot
      value:
        path: ./snapshots/yes_basic_yes_llm
    validate:
      - git init && git add -A && nix develop -c true
    answer_state:
      cyan/nix/basic:
        type: String
        value: 'yes'
      cyan/nix/llm:
        type: String
        value: 'yes'
    deterministic_state: {}
